plugins {
    id 'fabric-loom' version '1.9.2'
    id 'maven-publish'
}
version = '1.0.0'
group = 'dev.grxm'
base { archivesName = 'grxm-teams' }
repositories { mavenCentral(); maven { url = 'https://maven.shedaniel.me/' }; maven { url = 'https://api.modrinth.com/maven' } }
def numismaticsJar = providers.gradleProperty('numismaticsJar')
dependencies {
    minecraft 'com.mojang:minecraft:1.20.1'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.18.3'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.92.12+1.20.1'
    modImplementation('me.shedaniel.cloth:cloth-config-fabric:11.1.136') { exclude group: 'net.fabricmc.fabric-api' }
    if (numismaticsJar.isPresent()) modCompileOnly files(numismaticsJar.get())
    else modCompileOnly 'maven.modrinth:Jdbbtt0i:SJpLT0Bq'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}
def verifyNumismatics = tasks.register('verifyNumismatics') {
    doLast {
        def expected = '942e864837be870ea9584fd95a1bf43e05445f45286ca41f9b2774c89a9248067c3b3be9ba1a15641ea59ae870307f07670331b8473d743b0479f3d7ef294ed1'
        def jars = configurations.modCompileOnly.files.findAll { it.name.endsWith('.jar') }
        if (jars.size() != 1) throw new GradleException('Expected the one pinned Numismatics binary')
        def actual = java.security.MessageDigest.getInstance('SHA-512').digest(jars.first().bytes).encodeHex().toString()
        if (actual != expected) throw new GradleException('Numismatics SHA-512 mismatch: ' + actual)
    }
}
tasks.withType(JavaCompile).configureEach { dependsOn verifyNumismatics }
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 17; options.encoding = 'UTF-8' }
processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand version: project.version } }
test { useJUnitPlatform(); testLogging { events 'passed', 'failed', 'skipped' } }

// An opt-in, separate test MOD; never nested in the production JAR.
sourceSets { integration { compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath } }
tasks.register('integrationJar', Jar) {
    dependsOn integrationClasses
    from sourceSets.integration.output
    archiveClassifier = 'integration-dev'
}
tasks.register('remapIntegrationJar', net.fabricmc.loom.task.RemapJarTask) {
    dependsOn integrationJar
    inputFile = tasks.integrationJar.archiveFile
    archiveClassifier = 'integration-test'
    addNestedDependencies = false
}
