# Single-server Fabric configuration. World data is never distributed in Git.
server-port=25565
server-ip=
level-name=world
motd=GRXM SMP
online-mode=true
enforce-secure-profile=true
white-list=true
enforce-whitelist=true
enable-rcon=false
enable-query=false
enable-status=true
max-players=20
gamemode=survival
difficulty=easy
pvp=true
allow-flight=true
allow-nether=true
spawn-protection=0
view-distance=8
simulation-distance=6
network-compression-threshold=256
sync-chunk-writes=true
max-tick-time=60000
use-native-transport=true
